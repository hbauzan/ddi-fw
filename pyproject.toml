[project]
name = "ddi-fw"
version = "0.1.0"
description = "Firewall determinista de contención dimensional estricta para modelos de lenguaje."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Héctor Andrés Bauzán Saavedra, AKA \"eletor\"" },
]
license = { file = "LICENSE" }
classifiers = [
    "License :: Other/Proprietary License",
]
dependencies = [
    "einops>=0.8.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "pydantic-settings>=2.6",
    "sentence-transformers>=3.0",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
ddi-almas = "ddi_fw.almas:main"
ddi-press = "ddi_fw.press:main"
ddi-proxy = "ddi_fw.proxy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ddi_fw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: tests that load a real embedding model",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "tools",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

